# 知擎（ZhiQing）配置文件
# 优先级：环境变量 / .env > 本文件 > 代码默认值

[mysql]
host = localhost
port = 3306
# 生产不要用 root，按最小权限建专用账号
user = zhiqing
password = 123456
database = zhiqing_kb

[milvus]
host = localhost
port = 19530
database_name = zhiqing
collection_name = zhiqing_kb
# FAQ 标准问句单独一个小集合（80 条），命中即秒回标准答案
faq_collection_name = zhiqing_faq
embedding_model = bge-m3
# 推理设备：auto（有 GPU 就用）/ cuda / cpu
device = auto
# 半精度：auto（有 GPU 就开）/ true / false
fp16 = auto
# 每次向量化/写入的分块数，显存小时调小
embed_batch = 16

[llm]
# 任何 OpenAI 兼容服务都可以：qwen-plus / qwen-max / deepseek-chat ...
model = deepseek-chat
base_url = https://api.deepseek.com/v1
# 单次调用超时（秒）
timeout = 60

# 检索参数：知识库规模小（几十份文档），单层分块 + bge-m3 单向量直接召回即可
[retrieval]
chunk_size = 500
chunk_overlap = 60
# 向量召回条数（top-k）
retrieval_k = 5
# 相关性下限：bge-m3 归一化向量内积（=余弦相似度）低于该值的分块丢弃，
# 域外问题会被滤成空上下文，走"信息不足/人工客服"兜底
min_score = 0.35
# FAQ 命中阈值：问句与标准问句的余弦相似度 >= 该值才直接回标准答案
faq_min_score = 0.85

[app]
valid_sources = ["it", "oa", "security", "hr", "finance", "legal", "admin"]
customer_service_phone = 10086
api_prefix = /api/v1

# 简单 JWT 鉴权：/auth/login 换取 token，业务接口带 Bearer token 访问
[auth]
username = admin
# 演示账号口令，生产务必修改并用环境变量 AUTH_PASSWORD 注入
password = zhiqing@2026
# 签名密钥：生产用环境变量 JWT_SECRET 注入，不要沿用默认值
secret_key = zhiqing-dev-secret-change-in-prod
token_expire_minutes = 1440

[logger]
log_file = logs/app.log